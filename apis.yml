description: 'Apixio is a healthcare artificial intelligence company that applies machine learning and
  natural language processing to unstructured clinical and claims data for value-based care, risk
  adjustment, HCC coding, payment integrity, and healthcare analytics. Founded in 2009 and an early
  Bain Capital Ventures portfolio company, Apixio was acquired by Centene Corporation in 2020; its
  connected-care and coding products are delivered as enterprise B2B SaaS to health plans and providers.
  Apixio does not currently publish a public developer portal or open API; this profile captures its
  identity and domain-security posture for the API Evangelist network.'
